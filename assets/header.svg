<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Arup Gope - Full-Stack Developer, Gen AI and Agentic AI Builder" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" rx="12" fill="url(#bg)"/>
  <g opacity="0.12" fill="#00d9ff">
    <circle cx="90" cy="40" r="3"/><circle cx="210" cy="170" r="2"/><circle cx="330" cy="60" r="2.5"/>
    <circle cx="700" cy="30" r="2"/><circle cx="820" cy="150" r="3"/><circle cx="930" cy="70" r="2.5"/>
    <circle cx="600" cy="190" r="2"/><circle cx="450" cy="25" r="2"/>
  </g>
  <text x="500" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Arup Gope
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <rect x="420" y="122" width="160" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="160" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" from="500" to="420" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#b8d4e3">
    Full-Stack Developer  |  Gen AI &amp; Agentic AI Builder
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
